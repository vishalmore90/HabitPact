[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habitpact"
version = "0.1.0"
description = "Discord bot for accountability-based habit tracking within communities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Vishal More", email = "httpsvishal07@gmail.com" },
]
keywords = ["discord", "bot", "habits", "accountability", "streaks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "discord.py>=2.3,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
prod = [
    "asyncpg>=0.29",
]

[project.urls]
Homepage = "https://github.com/vishalmore90/HabitPact"
Repository = "https://github.com/vishalmore90/HabitPact"

[project.scripts]
habitpact = "habitpact.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/habitpact"]
