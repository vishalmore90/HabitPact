# render.yaml — Infrastructure as Code for Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: habitpact-bot
    runtime: python
    region: oregon
    plan: free               # 100% Free tier (Web Service)

    buildCommand: pip install -e ".[prod]"
    startCommand: python -m habitpact
    healthCheckPath: /health

    envVars:
      - key: DISCORD_TOKEN
        sync: false          # Set manually in Render dashboard — never in code

      - key: DATABASE_URL
        fromDatabase:
          name: habitpact-db
          property: connectionString

      - key: ENVIRONMENT
        value: prod

      - key: LOG_LEVEL
        value: INFO

      - key: PYTHON_VERSION
        value: "3.13"

      - key: PORT
        value: "10000"

databases:
  - name: habitpact-db
    databaseName: habitpact
    plan: free               # Free tier (Render expires after 30d; can swap for free permanent Neon/Supabase DB)
    region: oregon
